name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install frontend deps
        run: npm ci

      - name: Write signing key
        shell: pwsh
        run: Set-Content -Path "$env:RUNNER_TEMP\keel.key" -Value "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -NoNewline

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.RUNNER_TEMP }}\keel.key
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Keel v${{ github.ref_name }}"
          releaseBody: "See assets to download and install."
          releaseDraft: true
          includeUpdaterJson: true
